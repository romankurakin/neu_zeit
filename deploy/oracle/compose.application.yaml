x-application: &application
  image: neu_zeit:${REVISION:?Set REVISION}
  init: true
  env_file: /opt/neu-zeit/application.env
  environment:
    PORT: "4000"
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
services:
  application:
    <<: *application
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:?Set APP_PORT}:4000"
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:4000/terms"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24
  migrate:
    <<: *application
    profiles: [tools]
    command: [/app/bin/migrate]
