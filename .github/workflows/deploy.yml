name: Deploy demonstration host

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag or commit for a new demo
        default: main
      size:
        description: "New host only: droplet size. The solver uses two cores."
        default: s-2vcpu-2gb
      recreate:
        description: Recreate demo with this revision (deletes the demo database, keeps the URL)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demonstration-host
  cancel-in-progress: false

env:
  DROPLET: neu-zeit-demo
  DEMO_RESERVED_IP: ${{ vars.DEMO_RESERVED_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Check the revision before replacing a demo
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
          git fetch --no-tags --depth 1 origin "$REVISION"

      - name: Deploy with the permanent address
        env:
          REVISION: ${{ inputs.revision }}
          SIZE: ${{ inputs.size }}
          RECREATE: ${{ inputs.recreate }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash deploy/demo.sh deploy
