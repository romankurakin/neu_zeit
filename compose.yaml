services:
  application:
    build:
      context: .
      target: development
    image: neu_zeit:development
    init: true
    environment:
      DATABASE_HOST: database
      ERL_AFLAGS: "-kernel shell_history enabled inet_dist_use_interface {127,0,0,1}"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/app
      - elixir_build:/app/_build
      - elixir_deps:/app/deps
      - node_modules:/app/node_modules
      - colocated_assets:/app/assets/colocated
      - solver_venv:/app/priv/solver/.venv
      - dev_home:/home/dev
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${PORT:-4000}/ > /dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neu_zeit_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neu_zeit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
  elixir_build:
  elixir_deps:
  node_modules:
  colocated_assets:
  solver_venv:
  dev_home:
