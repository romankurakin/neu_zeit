services:
  db:
    image: postgres:17-alpine
    container_name: neu_zeit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neu_zeit_dev
    ports:
      - "5432:5432"
    volumes:
      - neu_zeit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neu_zeit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neu_zeit_postgres_data:
