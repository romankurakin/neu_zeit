name: Deploy demonstration host

# On a host that is already up this rolls the revision out in place: only the
# application image is rebuilt. The database volume is never named here, so a
# deploy keeps the demonstration data. Undeploy is the only way to discard it.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag or commit to deploy
        default: main
      region:
        description: "New host only: DigitalOcean region"
        default: fra1
      size:
        description: "New host only: droplet size. The solver needs two cores."
        default: s-2vcpu-2gb

permissions:
  contents: read

# One demonstration host at a time.
concurrency:
  group: demonstration-host

env:
  DROPLET: neu-zeit-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Look for a running host
        run: |
          if doctl compute droplet list --format Name --no-header \
            | grep -qx "$DROPLET"; then
            echo "RUNNING=yes" >> "$GITHUB_ENV"
          else
            echo "RUNNING=no" >> "$GITHUB_ENV"
          fi

      - name: Prepare the first boot
        if: env.RUNNING == 'no'
        run: |
          sed -e "s|__REPOSITORY__|${{ github.server_url }}/${{ github.repository }}.git|" \
              -e "s|__REVISION__|${{ inputs.revision }}|" \
              deploy/cloud-init.yaml > /tmp/cloud-init.yaml

      # The workflow cannot know which key is yours, so it adds every one.
      - name: Create the droplet
        if: env.RUNNING == 'no'
        run: |
          KEYS="$(doctl compute ssh-key list --format FingerPrint --no-header | paste -sd, -)"
          if [ -n "$KEYS" ]; then
            set -- --ssh-keys "$KEYS"
          else
            echo "The account has no SSH key. The droplet will not accept a shell."
            set --
          fi
          doctl compute droplet create "$DROPLET" \
            --image ubuntu-24-04-x64 \
            --size "${{ inputs.size }}" \
            --region "${{ inputs.region }}" \
            --user-data-file /tmp/cloud-init.yaml \
            --enable-monitoring \
            --wait "$@"

      - name: Roll the revision onto the running host
        if: env.RUNNING == 'yes'
        env:
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          REVISION: ${{ inputs.revision }}
        run: |
          case "$REVISION" in
            "" | *[!A-Za-z0-9._/-]*)
              echo "Refusing revision '$REVISION': expected a branch, tag or commit." >&2
              exit 1 ;;
          esac
          if [ -z "$KEY" ]; then
            echo "DEMO_SSH_KEY is not set. Add a private key the droplet accepts." >&2
            exit 1
          fi

          ADDRESS="$(doctl compute droplet get "$DROPLET" --format PublicIPv4 --no-header)"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$ADDRESS" >> ~/.ssh/known_hosts 2>/dev/null

          # Only the application image is rebuilt and only migrations run. The
          # database container keeps its volume and does not restart.
          ssh -o BatchMode=yes "root@$ADDRESS" "REVISION=$REVISION sh -s" <<'SH'
          set -eu
          cd /opt/neu-zeit/application
          git fetch --depth 1 origin "$REVISION"
          git checkout --force FETCH_HEAD
          docker compose -f compose.prod.yaml build application
          docker compose -f compose.prod.yaml run --rm migrate
          docker compose -f compose.prod.yaml up -d application
          SH

      - name: Report the address
        run: |
          ADDRESS="$(doctl compute droplet get "$DROPLET" --format PublicIPv4 --no-header)"
          HOST="$(printf '%s' "$ADDRESS" | tr '.' '-').sslip.io"
          {
            echo "### Demonstration host"
            echo
            echo "https://$HOST"
            echo
            if [ "$RUNNING" = no ]; then
              echo "The droplet builds the release on first boot, so the address"
              echo "answers a few minutes from now."
            fi
            echo
            echo '```'
            echo "ssh root@$ADDRESS"
            echo "tail -f /var/log/neu-zeit-start.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
