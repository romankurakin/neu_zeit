name: Deploy demonstration host

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag or commit to deploy
        default: main
      database_size:
        description: "First deployment only: database droplet size"
        default: s-1vcpu-1gb
      size:
        description: "New host only: droplet size. The solver uses two cores."
        default: s-2vcpu-2gb

permissions:
  contents: read

concurrency:
  group: demonstration-host
  cancel-in-progress: false

env:
  DEMO_RESERVED_IP: ${{ vars.DEMO_RESERVED_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Check the requested revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
          git fetch --no-tags --depth 1 origin "$REVISION"
          echo "DEPLOY_REVISION=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Deploy with the permanent address
        env:
          REVISION: ${{ env.DEPLOY_REVISION }}
          SIZE: ${{ inputs.size }}
          DATABASE_SIZE: ${{ inputs.database_size }}
          DATABASE_PASSWORD: ${{ secrets.DEMO_DATABASE_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.DEMO_SECRET_KEY_BASE }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash deploy/demo.sh deploy
