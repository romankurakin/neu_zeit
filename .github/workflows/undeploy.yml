name: Undeploy demonstration host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demonstration-host
  cancel-in-progress: false

env:
  DEMO_RESERVED_IP: ${{ vars.DEMO_RESERVED_IP }}

jobs:
  undeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Delete project servers, snapshots, network and address
        run: bash deploy/demo.sh undeploy
