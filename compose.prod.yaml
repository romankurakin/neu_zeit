name: neu_zeit_prod

x-application: &application
  image: ${NEU_ZEIT_IMAGE:-neu_zeit:production}
  build:
    context: .
    target: production
  init: true
  environment:
    DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database/neu_zeit
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    PHX_HOST: ${PHX_HOST:?Set PHX_HOST}
    PORT: "4000"
  depends_on:
    database:
      condition: service_healthy

services:
  application:
    <<: *application
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
  migrate:
    <<: *application
    profiles: [tools]
    command: ["/app/bin/migrate"]
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: neu_zeit
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neu_zeit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
