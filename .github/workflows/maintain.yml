name: Maintain demonstration host

# Every task runs against the droplet that is already up. Nothing here creates
# or deletes a host, and the database volume is never named, so the
# demonstration data survives.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do on the running host
        type: choice
        default: update
        options:
          - update
          - monitoring
          - resize
      revision:
        description: "update: branch, tag or commit to roll out"
        default: main
      size:
        description: "resize: droplet size. CPU and RAM only, the disk is untouched."
        default: s-4vcpu-8gb

permissions:
  contents: read

# The deploy and undeploy workflows hold the same group, so a rebuild cannot
# start while a host is being replaced.
concurrency:
  group: demonstration-host

env:
  DROPLET: neu-zeit-demo

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Find the running host
        run: |
          if ! doctl compute droplet list --format Name --no-header \
            | grep -qx "$DROPLET"; then
            echo "No $DROPLET to maintain. Run Deploy first." >&2
            exit 1
          fi
          {
            echo "DROPLET_ID=$(doctl compute droplet get "$DROPLET" --format ID --no-header)"
            echo "ADDRESS=$(doctl compute droplet get "$DROPLET" --format PublicIPv4 --no-header)"
          } >> "$GITHUB_ENV"

      # The deploy workflow authorizes every key on the account, so DEMO_SSH_KEY
      # is any one of those private keys.
      - name: Authorize the runner
        env:
          KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "DEMO_SSH_KEY is not set. Add a private key the droplet accepts." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$ADDRESS" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll out the revision
        if: inputs.task == 'update'
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          case "$REVISION" in
            "" | *[!A-Za-z0-9._/-]*)
              echo "Refusing revision '$REVISION': expected a branch, tag or commit." >&2
              exit 1 ;;
          esac

          # Only the application image is rebuilt and only migrations run. The
          # database container keeps its volume and does not restart.
          ssh -o BatchMode=yes "root@$ADDRESS" "REVISION=$REVISION sh -s" <<'SH'
          set -eu
          cd /opt/neu-zeit/application
          git fetch --depth 1 origin "$REVISION"
          git checkout --force FETCH_HEAD
          docker compose -f compose.prod.yaml build application
          docker compose -f compose.prod.yaml run --rm migrate
          docker compose -f compose.prod.yaml up -d application
          SH

      - name: Install the metrics agent
        if: inputs.task == 'monitoring'
        run: |
          # The installer writes to /opt/digitalocean and touches nothing else.
          # It changes nothing on a host that already reports metrics.
          ssh -o BatchMode=yes "root@$ADDRESS" sh -s <<'SH'
          set -eu
          curl -fsSL https://repos.insights.digitalocean.com/install.sh | bash
          systemctl is-active do-agent
          SH

      - name: Resize the plan
        if: inputs.task == 'resize'
        env:
          SIZE: ${{ inputs.size }}
        run: |
          # Without --resize-disk this moves CPU and RAM only: the disk holding
          # the database is untouched and the change can be reversed later.
          doctl compute droplet-action power-off "$DROPLET_ID" --wait
          doctl compute droplet-action resize "$DROPLET_ID" --size "$SIZE" --wait
          doctl compute droplet-action power-on "$DROPLET_ID" --wait

      - name: Wait for the host to answer
        run: |
          HOST="$(printf '%s' "$ADDRESS" | tr '.' '-').sslip.io"
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null "https://$HOST/"; then
              {
                echo "### ${{ inputs.task }} finished"
                echo
                echo "https://$HOST"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "$DROPLET did not answer within five minutes. Read the log with:" >&2
          echo "  ssh root@$ADDRESS docker compose -f /opt/neu-zeit/application/compose.prod.yaml logs application" >&2
          exit 1
