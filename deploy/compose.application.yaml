name: neu_zeit_app
x-application: &application
  image: neu_zeit:production
  build:
    context: .
    target: production
  init: true
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    PHX_HOST: ${PHX_HOST:?Set PHX_HOST}
    PORT: "4000"
services:
  application:
    <<: *application
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
  migrate:
    <<: *application
    profiles: [tools]
    command: ["/app/bin/migrate"]
