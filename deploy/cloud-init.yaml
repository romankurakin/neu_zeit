#cloud-config
package_update: true

# The host compiles the release on first boot. That build, not serving, is the
# memory peak, so a small plan needs swap to survive it. The disk has room.
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

packages:
  - ca-certificates
  - curl
  - git
  - openssl

write_files:
  - path: /opt/neu-zeit/start
    permissions: "0755"
    content: |
      #!/bin/sh
      # The deploy workflow supplies the repository, revision and permanent host.
      set -eu

      APPLICATION=/opt/neu-zeit/application
      mkdir -p "${APPLICATION}"
      cd "${APPLICATION}"
      git init
      git remote add origin "__REPOSITORY__"
      git fetch --depth 1 origin "__REVISION__"
      git checkout --detach FETCH_HEAD

      # sslip.io resolves this name back to the address, so Caddy can get a
      # certificate for it without a registered domain.
      HOST="__HOST__"

      # The secrets are made here. They reach neither the log nor the repository.
      {
        printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'SECRET_KEY_BASE=%s\n' "$(openssl rand -base64 48)"
        printf 'PHX_HOST=%s\n' "${HOST}"
      } > .env
      chmod 600 .env

      docker compose -f compose.prod.yaml build application
      docker compose -f compose.prod.yaml up -d database
      docker compose -f compose.prod.yaml run --rm migrate
      docker compose -f compose.prod.yaml up -d application

      printf '%s {\n  reverse_proxy 127.0.0.1:4000\n}\n' "${HOST}" \
        > /opt/neu-zeit/Caddyfile

      # Host networking lets Caddy hold 80 and 443 and still reach the
      # loopback port that compose.prod.yaml publishes.
      docker run --detach --name caddy --restart unless-stopped --network host \
        --volume /opt/neu-zeit/Caddyfile:/etc/caddy/Caddyfile:ro \
        --volume caddy_data:/data \
        caddy:2

      printf 'https://%s\n' "${HOST}" > /opt/neu-zeit/address

runcmd:
  # DigitalOcean's metrics agent. --enable-monitoring already installs it, so
  # this only covers a host created without the flag.
  - [sh, -c, "command -v /opt/digitalocean/bin/do-agent >/dev/null 2>&1 || curl -fsSL https://repos.insights.digitalocean.com/install.sh | bash"]
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [sh, -c, "/opt/neu-zeit/start 2>&1 | tee /var/log/neu-zeit-start.log"]
