name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Compile, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check deployment data preservation
        run: python3 -m unittest discover -s deploy -p 'test_*.py'

      - uses: docker/setup-buildx-action@v4

      - name: Build the development image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          tags: neu_zeit:development
          load: true
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development

      # The image bakes user dev as 1000, the runner checks out as 1001, and a
      # Linux bind mount keeps the host owner. Without this the container
      # cannot write to the workspace or to a freshly created volume.
      - name: Give the workspace and the volumes to the container user
        run: |
          sudo chown -R 1000:1000 .
          docker compose run --rm --no-deps --user root application \
            chown -R dev:dev /app /home/dev

      - name: Start the stack
        run: docker compose up --wait --wait-timeout 900 application

      - name: Run the checks
        run: docker compose exec -T application mix ci

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

  release:
    name: Production image and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          tags: neu_zeit:production
          load: true
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Apply migrations with the release
        env:
          POSTGRES_PASSWORD: postgres
          PHX_HOST: localhost
        run: |
          SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            docker compose -f compose.prod.yaml run --rm migrate

      - name: Container logs
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color
